<section id="exibicao-banner" aria-roledescription="carrossel" aria-label="Eventos em destaque">
    <div class="banner-grande" 
        (touchstart)="touchStart($event)" 
        (touchend)="touchEnd($event)">

        <img [src]="listaBanner[index].imagem" class="imagem" [attr.alt]="'Destaque: ' + listaBanner[index].titulo">

        <div class="layer"></div>

        <button type="button" 
                class="wcag-banner-link" 
                (click)="abrirEvento(listaBanner[index].titulo)"
                [attr.aria-label]="'Acessar evento: ' + listaBanner[index].titulo">
        </button>

        <div class="info">
            <h1>{{ listaBanner[index].titulo }}</h1>
            <p>{{ listaBanner[index].localNome }} • {{ listaBanner[index].cidade }} | {{ listaBanner[index].dataExibicao }}</p>
            
            <span class="btn-info" (click)="abrirEvento(listaBanner[index].titulo); $event.stopPropagation()">
                Mais informações
            </span>
        </div>

        <div class="setas">
            <button type="button" class="seta-left" (click)="anterior(); $event.stopPropagation()" aria-label="Banner anterior">
                <span aria-hidden="true">❮</span>
            </button>
            <button type="button" class="seta-right" (click)="proximo(); $event.stopPropagation()" aria-label="Próximo banner">
                <span aria-hidden="true">❯</span>
            </button>
        </div>

        <div class="indicadores" role="tablist" aria-label="Slides do destaque">
            @for (img of listaBanner; track $index) {
              <button 
                type="button"
                class="ponto" 
                [class.ativo]="$index === index" 
                (click)="irPara($index); $event.stopPropagation()"
                role="tab"
                [attr.aria-selected]="$index === index"
                [attr.aria-label]="'Ir para o slide ' + ($index + 1)">
              </button>
            }
        </div>
    </div>
</section>
