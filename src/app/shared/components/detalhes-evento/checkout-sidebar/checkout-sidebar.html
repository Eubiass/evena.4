<div
  class="checkout-card"
  role="region"
  aria-label="Área de ingressos e ações do evento"
>

  <app-price-header
    [preco]="evento?.preco"
  >
  </app-price-header>


  <app-organizer-card
    [organizador]="organizador"
    [isSeguindo]="isSeguindo"
    (profileClick)="irParaPerfilOrganizador()"
    (followToggle)="alternarSeguir($event)"
  >
  </app-organizer-card>


  <app-event-brief-info
    [dataExibicao]="evento?.dataExibicao"
    [horario]="evento?.horario"
  >
  </app-event-brief-info>


  <app-event-actions
    [isSalvo]="isSalvo"
    (comprar)="redirecionarParceiro()"
    (salvar)="alternarSalvar()"
    (agenda)="adicionarAoCalendario()"
    (compartilhar)="compartilharEvento()"
  >
  </app-event-actions>


  <div class="card-footer-report">

    <button
      type="button"
      class="btn-report"
    >

      <i
        class="fa-regular fa-flag"
        aria-hidden="true"
      ></i>

      <span>
        Reportar este evento
      </span>

    </button>

  </div>

</div>
