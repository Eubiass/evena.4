
<div class="action-container">
  <button
    type="button"
    class="btn-poly btn-main"
    (click)="onComprar()"
    aria-label="Garantir ingressos; abre o site do parceiro"
  >
    <span>Garantir Ingressos</span>
    <i
      class="fa-solid fa-arrow-up-right-from-square"
      aria-hidden="true"
    ></i>
  </button>

  <button
    type="button"
    class="btn-poly btn-fav"
    [class.active]="isFavoritado"
    [class.loading]="salvandoFavorito"
    [disabled]="salvandoFavorito"
    (click)="onFavoritar()"
    [attr.aria-busy]="salvandoFavorito"
    [attr.aria-pressed]="isFavoritado"
    [attr.aria-label]="salvandoFavorito
      ? 'Atualizando favoritos'
      : isFavoritado
        ? 'Remover dos favoritos'
        : 'Adicionar aos favoritos'"
  >
    <div class="heart-wrapper" aria-hidden="true">
      <i class="bi" [class.bi-heart-fill]="isFavoritado" [class.bi-heart]="!isFavoritado"></i>

      <span class="particle p1"></span>
      <span class="particle p2"></span>
      <span class="particle p3"></span>
      <span class="particle p4"></span>
    </div>

    <span>
      {{ salvandoFavorito
        ? 'Atualizando...'
        : isFavoritado
          ? 'Favoritado'
          : 'Favoritar Evento' }}
    </span>
  </button>

  <div class="secondary-actions-row">
    <button
      type="button"
      class="btn-poly btn-dark btn-agenda"
      (click)="onAgenda()"
      aria-label="Adicionar evento ao calendário"
    >
      <i class="fa-solid fa-calendar-plus" aria-hidden="true"></i>
      <span>Agenda</span>
    </button>

    <button
      type="button"
      class="btn-poly btn-dark btn-share"
      (click)="onCompartilhar()"
      aria-label="Compartilhar evento"
    >
      <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>
    </button>
  </div>
</div>
