<header class="hero-header" [style.backgroundImage]="'url(' + evento?.imagem + ')'">
  <div class="hero-overlay">
    <div class="hero-content">
      
      <img [src]="evento?.imagem" class="hero-capa" alt="Capa do Evento">
      
      <div class="hero-text">
        @if (evento?.categoria?.length) {
          <span class="tag-categoria">{{ evento?.categoria?.[0] }}</span>
        }
        <h1>{{ evento?.titulo }}</h1>
        <p class="hero-loc">
          <i class="fa-solid fa-location-dot"></i> {{ evento?.cidade }}, {{ evento?.uf }}
        </p>
      </div>

    </div>
  </div>
</header>
