<section class="info-block" aria-labelledby="titulo-comodidades">
  <div class="block-header">
    <h2 id="titulo-comodidades">Comodidades e Facilidades</h2>
  </div>
  
  <ul class="facilidades-container-grid" style="list-style: none; padding: 0; margin: 0;">
    
    <li class="facilidade-tag" 
        [class.ativa]="evento?.acessibilidade" 
        [class.inativa]="!evento?.acessibilidade">
      <i class="fa-solid fa-wheelchair" aria-hidden="true"></i>
      <span class="facilidade-nome">Acessibilidade</span>
      <span class="facilidade-status" aria-live="polite">
        {{ evento?.acessibilidade ? 'Disponível' : 'Não disponível' }}
      </span>
    </li>

    <li class="facilidade-tag" 
        [class.ativa]="evento?.estacionamento" 
        [class.inativa]="!evento?.estacionamento">
      <i class="fa-solid fa-car" aria-hidden="true"></i>
      <span class="facilidade-nome">Estacionamento</span>
      <span class="facilidade-status" aria-live="polite">
        {{ evento?.estacionamento ? 'Possui no local' : 'Não possui' }}
      </span>
    </li>

    <li class="facilidade-tag" 
        [class.ativa]="evento?.wifi" 
        [class.inativa]="!evento?.wifi">
      <i class="fa-solid fa-wifi" aria-hidden="true"></i>
      <span class="facilidade-nome">Wi-Fi</span>
      <span class="facilidade-status" aria-live="polite">
        {{ evento?.wifi ? 'Disponível' : 'Não disponível' }}
      </span>
    </li>

  </ul>
</section>
