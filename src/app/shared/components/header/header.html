<header class="app-header" [class.busca-ativa]="pesquisaAtiva" role="banner">
  
  <div class="header-section left">
    @if (!pesquisaAtiva) {
      <a routerLink="/" class="logo-link">
        <img src="nomeEvena.svg" class="logo" alt="Evena">
      </a>
    }
  </div>

  <nav class="header-section center desktop-only" aria-label="Navegação principal">
    @if (!pesquisaAtiva) {
      <a class="btn_nav_bar" 
         routerLink="/" 
         routerLinkActive="ativo" 
         [routerLinkActiveOptions]="{ exact: true }">
         Início
      </a>
      <a class="btn_nav_bar" 
         routerLink="/eventos" 
         routerLinkActive="ativo">
         Eventos
      </a>
    }
  </nav>

  <section class="header-section right" [class.expandida]="pesquisaAtiva">
    
    <div class="btn-search" [class.active]="pesquisaAtiva">
      <button 
        type="button" 
        class="search-trigger" 
        (click)="togglePesquisa()" 
        [attr.aria-expanded]="pesquisaAtiva ? 'true' : 'false'"
        aria-label="Abrir campo de pesquisa">
        <img src="search.png" class="search" alt="" aria-hidden="true">
      </button>

      <input 
        type="text" 
        placeholder="Pesquisar..." 
        id="campo-busca"
        aria-label="Pesquisar eventos"
        [(ngModel)]="termoPesquisa"
        (keyup.enter)="fazerPesquisa()"
        autocomplete="off" >

      @if (pesquisaAtiva) {
        <button (click)="togglePesquisa()" class="btn-fechar" type="button" aria-label="Fechar busca">×</button>
      }
    </div>

    @if (!pesquisaAtiva) {
      <a routerLink="/perfil" class="perfil-link desktop-only" aria-label="Acessar meu perfil">
        <img src="perfil.png" class="perfil" alt="" aria-hidden="true">
      </a>
      
      <button 
        class="menu-mobile-btn" 
        (click)="toggleMenu()" 
        [attr.aria-expanded]="menuAberto ? 'true' : 'false'"
        aria-label="Menu principal">
        <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>
    }
  </section>

  <aside class="menu-overlay" [class.aberto]="menuAberto" [attr.aria-hidden]="!menuAberto ? 'true' : 'false'" role="dialog" aria-label="Menu móvel">
    <button type="button" class="btn_fechar_menu" (click)="toggleMenu()" aria-label="Fechar menu principal">×</button>
    
    <nav class="mobile-nav" aria-label="Navegação móvel">
      <a routerLink="/" 
         routerLinkActive="ativo" 
         [routerLinkActiveOptions]="{ exact: true }" 
         (click)="toggleMenu()">
         Início
      </a>
      <a routerLink="/eventos" 
         routerLinkActive="ativo" 
         (click)="toggleMenu()">
         Eventos
      </a>
      <hr class="divisor-menu" role="presentation">
      <a routerLink="/perfil" 
         routerLinkActive="ativo" 
         (click)="toggleMenu()">
         Meu Perfil
      </a>
    </nav>
  </aside>

</header>
