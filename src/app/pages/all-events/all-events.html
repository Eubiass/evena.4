<section class="pagina-eventos">
  <div class="layout-container">

    <app-header-events
      [titulo]="'Explorar Eventos'"
      [subtitulo]="'Descubra os melhores eventos perto de você'"
      [temFiltroAtivo]="(temFiltroAtivo$ | async) ?? false"
      (abrirFiltros)="abrirModalFiltros()"
      (limparFiltros)="limparTudo()">
    </app-header-events>

    <app-categorias-nav
      (categoriaSelecionada)="aoSelecionarCategoria($event)">
    </app-categorias-nav>

    <main role="main">
      <app-grid-events 
        [eventos$]="eventosFiltrados$"
        (resetar)="limparTudo()">
      </app-grid-events>
    </main>

  </div>
</section>

<!-- Novo Componente de Modal -->
<app-modal-filtros
  [aberto]="modalFiltroAberto"
  [filtrosIniciais]="filtrosAtuais"
  (fechar)="fecharModalFiltros()"
  (aplicar)="aplicarFiltrosDoModal($event)"
  (resetar)="limparTudo(); fecharModalFiltros()">
</app-modal-filtros>
