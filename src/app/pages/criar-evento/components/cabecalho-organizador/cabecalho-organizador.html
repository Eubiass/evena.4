<header class="cabecalho-organizador">

  <a
    class="logo-link"
    href="/"
    aria-label="Ir para a página inicial"
  >
    <img
      src="nomeEvena.svg"
      class="logo"
      alt="Evena"
    >
  </a>


  <nav
    class="navegacao"
    aria-label="Navegação principal"
  >

    <a href="/">
      Explorar
    </a>

    <a href="#">
      Organize seu evento
    </a>

  </nav>


  <div class="acoes">

    <button
      class="notificacao"
      type="button"
      aria-label="Notificações"
    >
      <i
        class="fa-regular fa-bell"
        aria-hidden="true"
      ></i>
    </button>


    <button
      class="perfil"
      type="button"
      aria-label="Perfil"
    >
      <span class="avatar"></span>
    </button>

  </div>

</header>
