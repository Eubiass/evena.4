<div class="tela-login-background">
  <div class="wrapper-login">
    
    <section id="container-esq">
      <div class="overlay-brand">
        <img src="coroaEvena.svg" alt="Logo Evena" id="img-coroa">
        <p class="tagline-evena">Viver é melhor ao vivo.</p>
      </div>
    </section>

    <section id="container-principal">
      <form id="form-login" (submit)="executarLogin($event)">
        
        <header class="header-form">
          <h1 class="titulo-login">Seja bem-vindo</h1>
          <p class="subtitulo-login">Escolha como deseja acessar a plataforma</p>
        </header>

        <div class="opcoes">
          <div class="sliding-pill" [class.slide-organizador]="tipoPerfil === 'organizador'"></div>
          
          <button type="button" 
                  class="btn-opcoes" 
                  [class.active]="tipoPerfil === 'usuario'"
                  (click)="mudarPerfil('usuario')">
            Usuário
          </button>
          <button type="button" 
                  class="btn-opcoes" 
                  [class.active]="tipoPerfil === 'organizador'"
                  (click)="mudarPerfil('organizador')">
            Organizador
          </button>
        </div>

        <div class="area-inputs">
          <div class="grupo-input">
            <input type="text" 
                   name="username"
                   [(ngModel)]="usuario"
                   [placeholder]="tipoPerfil === 'usuario' ? 'Nome do Usuário' : 'Nome do Organizador'"
                   autocomplete="off" 
                   required>
          </div>

          <div class="grupo-input">
            <input type="password" 
                   name="password"
                   [(ngModel)]="senha"
                   placeholder="Senha" 
                   required>
          </div>
        </div>

        <div class="linha-utilitarios">
          <label class="container-checkbox">
            <input type="checkbox" name="remember" id="remember">
            <span class="marcador-premium"></span>
            Lembre de mim
          </label>
          <a class="link-esqueceu-senha">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn-entrar">
          Acessar como {{ tipoPerfil === 'usuario' ? 'Usuário' : 'Organizador' }}
        </button>

        <div class="container-cadastro-link">
          <span class="texto-chamada">Não tem uma conta?</span>
            <a class="link-cadastre-se" routerLink="/cadastro">Cadastre-se</a>
        </div>
        
        <div class="divisor">
          <span>ou conecte-se via</span>
        </div>

        <div class="container-sociais">
          <button type="button" class="btn-social google" (click)="loginComGoogle()" aria-label="Entrar com o Google">
            <span>Google</span>
          </button>
          
          <button type="button" class="btn-social apple" (click)="loginComApple()" aria-label="Entrar com a Apple">
            <span>Apple</span>
          </button>
        </div>

      </form>
    </section>

  </div>
</div>
